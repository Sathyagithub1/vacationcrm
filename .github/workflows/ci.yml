name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Ephemeral, CI-only Postgres + Redis containers. The repo's vitest suites
    # are DB-backed; these containers are created fresh per run and destroyed
    # afterwards. No live/shared database is ever touched.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: holiday_delight_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Obviously-fake placeholders for CI only. Not real secrets.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/holiday_delight_crm_ci
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/holiday_delight_crm_ci
      REDIS_URL: redis://localhost:6379
      REDIS_URL_TEST: redis://localhost:6379
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret-0000000000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations to ephemeral CI database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build (includes Next.js type check)
        run: npm run build

      - name: Unit/integration tests (node, offline, mocked AI providers)
        run: npm test

      - name: UI component tests (jsdom)
        run: npm run test:ui
